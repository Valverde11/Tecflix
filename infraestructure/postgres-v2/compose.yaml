
services:
  postgres:
    image: postgres:17
    restart: unless-stopped

    environment:
      POSTGRES_USER: tecflix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Password required}
      POSTGRES_DB: tecflix_v2

    ports:
      - "127.0.0.1:55432:5432"

    volumes:
      - postgres_v2_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          psql -X -w -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -Atqc
          "SELECT to_regclass('users') IS NOT NULL AND to_regclass('quota_operations') IS NOT NULL AND to_regprocedure('apply_quota_operation(bigint,text,bigint)') IS NOT NULL AND current_setting('transaction_read_only') = 'off'" | grep -qx t
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_v2_data:


