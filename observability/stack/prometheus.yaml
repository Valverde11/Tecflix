global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]

  - job_name: otel-metrics
    static_configs:
      - targets: ["otel-collector:9464"]

  - job_name: blackbox-exporter
    static_configs:
      - targets: ["blackbox-exporter:9115"]

  # Health probe independiente del pipeline de métricas de cada API.
  - job_name: service-health
    metrics_path: /probe
    params:
      module: [http_2xx]

    static_configs:
      # Máquina A: macOS
      - targets: ["http://tecflix-macos:8081/health"]
        labels:
          service_name: user-service
          service_instance_id: maquina-A

      - targets: ["http://tecflix-macos:8082/health"]
        labels:
          service_name: metadata-service
          service_instance_id: maquina-A

      - targets: ["http://tecflix-macos:8083/health"]
        labels:
          service_name: streaming-service
          service_instance_id: maquina-A

      # Máquina B: Ubuntu ARM64
      - targets: ["http://tecflix-ubuntu:8081/health"]
        labels:
          service_name: user-service
          service_instance_id: maquina-B

      - targets: ["http://tecflix-ubuntu:8082/health"]
        labels:
          service_name: metadata-service
          service_instance_id: maquina-B

      - targets: ["http://tecflix-ubuntu:8083/health"]
        labels:
          service_name: streaming-service
          service_instance_id: maquina-B

    relabel_configs: &blackbox_relabel
      - source_labels: [__address__]
        target_label: __param_target

      - source_labels: [__param_target]
        target_label: instance

      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: service-readiness
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://tecflix-macos:8081/ready"]
        labels: {service_name: user-service, service_instance_id: maquina-A}
      - targets: ["http://tecflix-ubuntu:8081/ready"]
        labels: {service_name: user-service, service_instance_id: maquina-B}
      - targets: ["http://tecflix-macos:8082/ready"]
        labels: {service_name: metadata-service, service_instance_id: maquina-A}
      - targets: ["http://tecflix-ubuntu:8082/ready"]
        labels: {service_name: metadata-service, service_instance_id: maquina-B}
    relabel_configs: *blackbox_relabel
