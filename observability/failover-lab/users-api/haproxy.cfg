
global
    log stdout format raw local0
    maxconn 1000

defaults
    log global
    mode http
    option httplog
    option dontlognull

    timeout connect 3s
    timeout client 30s
    timeout server 30s

frontend users_frontend
    bind *:8080

    acl health_method method GET
    acl health_path path -i /health

    acl login_method method POST
    acl login_path path -i /api/auth/login

    http-request deny deny_status 403 unless health_method health_path or login_method login_path

    default_backend users_backend

backend users_backend
    balance roundrobin

    option httpchk GET /health
    http-check expect status 200

    default-server inter 2s fall 2 rise 2

    http-response set-header X-Tecflix-Backend %[srv_name]

    server maquina-A host.docker.internal:8181 check
    server maquina-B 192.168.64.2:8182 check

