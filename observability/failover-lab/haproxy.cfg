
global
    log stdout format raw local0
    maxconn 1000

defaults
    mode http
    log global
    option httplog
    option dontlognull
    timeout connect 3s
    # Los POST de video admiten cuerpos grandes; 15 s cortaba subidas legítimas.
    timeout client 10m
    timeout server 10m

# El balanceador no debe bloquear las rutas de negocio.
# La autenticación y autorización ya se hacen en cada API.
frontend users_frontend
    bind *:9081
    default_backend users_backend

frontend metadata_frontend
    bind *:9082
    default_backend metadata_backend

frontend streaming_frontend
    bind *:9083
    default_backend streaming_backend

backend users_backend
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    http-response set-header X-Tecflix-Backend %[srv_name]
    server maquina-A host.docker.internal:8081 check inter 2s fall 2 rise 2
    server maquina-B 192.168.64.2:8081 check inter 2s fall 2 rise 2

backend metadata_backend
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    http-response set-header X-Tecflix-Backend %[srv_name]
    server maquina-A host.docker.internal:8082 check inter 2s fall 2 rise 2
    server maquina-B 192.168.64.2:8082 check inter 2s fall 2 rise 2

backend streaming_backend
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    http-response set-header X-Tecflix-Backend %[srv_name]
    server maquina-A host.docker.internal:8083 check inter 2s fall 2 rise 2
    server maquina-B 192.168.64.2:8083 check inter 2s fall 2 rise 2

listen stats
    bind *:9099
    mode http
    stats enable
    stats uri /stats
    stats refresh 5s
