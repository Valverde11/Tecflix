# Tecflix V2: laboratorio LOCAL de failover de metadata (dos procesos en macOS).
# NO usar como configuración de producción ni como prueba de dos máquinas.
global
    log stdout format raw local0
    maxconn 1000

defaults
    mode http
    log global
    option httplog
    option dontlognull
    timeout connect 3s
    timeout client 30s
    timeout server 30s

frontend metadata_frontend
    bind *:9082
    default_backend metadata_backend

backend metadata_backend
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    http-response set-header X-Tecflix-Backend %[srv_name]
    server metadata-A host.docker.internal:8082 check inter 1s fall 2 rise 2
    server metadata-B host.docker.internal:8182 check inter 1s fall 2 rise 2

# Solo para desarrollo, publicado por Docker exclusivamente en localhost.
listen stats
    bind *:9099
    mode http
    stats enable
    stats uri /stats
    stats refresh 2s
