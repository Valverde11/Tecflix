# Tecflix V2 - laboratorio multi-API, macOS + VM Ubuntu (no producción).
# No bloquea rutas de negocio: autenticación/autorización permanecen en las APIs.
global
    log stdout format raw local0
    maxconn 1000

defaults
    mode http
    log global
    option httplog
    option dontlognull
    timeout connect 3s
    timeout client 30s
    timeout server 30s

frontend users_frontend
    bind *:9281
    default_backend users_backend

frontend metadata_frontend
    bind *:9282
    default_backend metadata_backend

frontend streaming_frontend
    bind *:9283
    timeout client 10m
    default_backend streaming_backend

backend users_backend
    balance roundrobin
    option httpchk GET /ready
    http-check expect status 200
    http-response set-header X-Tecflix-Backend %[srv_name]
    server macos tecflix-macos:8081 check inter 1s fall 2 rise 2
    server ubuntu tecflix-ubuntu:8081 check inter 1s fall 2 rise 2

backend metadata_backend
    balance roundrobin
    # Readiness consulta MongoDB, no solo liveness del proceso.
    option httpchk GET /ready
    http-check expect status 200
    http-response set-header X-Tecflix-Backend %[srv_name]
    server macos tecflix-macos:8082 check inter 1s fall 2 rise 2
    server ubuntu tecflix-ubuntu:8082 check inter 1s fall 2 rise 2

backend streaming_backend
    option httpchk GET /health
    http-check expect status 200
    timeout server 10m
    http-response set-header X-Tecflix-Backend %[srv_name]
    # Todo el flujo de subida y reproducción usa el mismo estado local.
    # Habilitar otro nodo requiere almacenamiento y relevo de escritor coordinados.
    server macos tecflix-macos:8083 check inter 1s fall 2 rise 2

listen stats
    bind *:9299
    mode http
    stats enable
    stats uri /stats
    stats refresh 2s
