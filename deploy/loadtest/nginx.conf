resolver 127.0.0.11 valid=5s ipv6=off;

upstream users_backend {
    zone users_backend 64k;
    server users:8081 resolve max_fails=2 fail_timeout=5s;
    keepalive 16;
}

upstream metadata_backend {
    zone metadata_backend 64k;
    server metadata:8082 resolve max_fails=2 fail_timeout=5s;
    keepalive 32;
}

upstream streaming_backend {
    zone streaming_backend 64k;
    server streaming:8083 resolve max_fails=2 fail_timeout=5s;
    keepalive 16;
}

server {
    listen 8081;

    location / {
        proxy_pass http://users_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }
}

server {
    listen 8082;

    location / {
        proxy_pass http://metadata_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }
}

server {
    listen 8083;
    client_max_body_size 2g;

    location / {
        proxy_pass http://streaming_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }
}